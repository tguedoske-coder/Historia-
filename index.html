<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Repaso de Historia de España</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Disposición: app de una columna para móvil. Cabecera fija con el avance, contenido que desliza y barra inferior con 5 pestañas.
   Cada bloque de los apuntes conserva su color (--c) en todas las vistas, como los periodos de un atlas. */
:root{
  --f-display:'Alegreya',Georgia,'Times New Roman',serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F4F6F9;
  --ink:#101A2B; --ink-2:#3F4C60; --ink-3:#5B687A;
  --line:#D3D9E2; --line-2:#E4E8EF; --focus:#2F5BEA;
  --good:#17784A; --bad:#B3261E;
  --c-roma:#7A45C2; --c-visi:#B7701A; --c-and:#1F8A57; --c-cortes:#3A62C8;
  --c-desc:#0D86A4; --c-imp:#C13B2D; --c-oliv:#C03F7B; --c-crisis:#6E8A14;
  --r:4px; --gut:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1320; --surface:#141D2D; --surface-2:#1A2539;
    --ink:#E8EDF5; --ink-2:#B5C0D2; --ink-3:#8E9BB0;
    --line:#2B3850; --line-2:#222E43; --focus:#8EB0FF;
    --good:#4CC38A; --bad:#FF8F84;
    --c-roma:#A982E6; --c-visi:#E0A04A; --c-and:#48C28A; --c-cortes:#7B9BF0;
    --c-desc:#3FC0DE; --c-imp:#F0776A; --c-oliv:#EC7BAE; --c-crisis:#A4C447;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1320; --surface:#141D2D; --surface-2:#1A2539;
  --ink:#E8EDF5; --ink-2:#B5C0D2; --ink-3:#8E9BB0;
  --line:#2B3850; --line-2:#222E43; --focus:#8EB0FF;
  --good:#4CC38A; --bad:#FF8F84;
  --c-roma:#A982E6; --c-visi:#E0A04A; --c-and:#48C28A; --c-cortes:#7B9BF0;
  --c-desc:#3FC0DE; --c-imp:#F0776A; --c-oliv:#EC7BAE; --c-crisis:#A4C447;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-body);-webkit-text-size-adjust:100%;overflow-x:hidden}
h1,h2,h3,p,ul,ol,figure{margin:0}
ul,ol{padding:0;list-style:none}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:640px;margin-inline:auto;padding-inline:var(--gut)}
.lab{font:600 11px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* botones y chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--ink);border-radius:var(--r);background:transparent;font:700 15px/1 var(--f-body)}
.btn.pri{background:var(--ink);color:var(--surface)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:default}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:2px 6px;margin-inline:calc(var(--gut) * -1);padding-inline:var(--gut);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font:700 13px/1 var(--f-body);color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip .dot{width:9px;height:9px;border-radius:2px;background:var(--c)}
.tag{display:inline-flex;align-items:center;gap:6px;padding:5px 8px 5px 6px;border-radius:2px;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--ink);font:600 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.tag::before{content:'';width:8px;height:8px;border-radius:1px;background:var(--c)}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.seg button{flex:1;min-height:40px;border:0;background:transparent;font:700 13px/1.1 var(--f-body);color:var(--ink-2);padding:0 8px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.h2{font:800 24px/1.15 var(--f-display);text-wrap:balance}
.intro{color:var(--ink-2);font-size:15px;max-width:60ch}
.sec{display:flex;flex-direction:column;gap:14px;padding-block:18px 0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
/* cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand h1{font:800 21px/1.05 var(--f-display)}
.meter{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:0 0 auto}
.meter b{font:600 12px/1 var(--f-mono);color:var(--ink-2)}
.bar{width:96px;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .3s}
/* contenido */
.app{padding-block:6px 96px}
.panel{display:flex;flex-direction:column;gap:14px;padding-top:14px}
/* barra inferior */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding-inline:4px}
.tabs button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:58px;border:0;background:transparent;color:var(--ink-3);font:700 11px/1 var(--f-body)}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"]::before{content:'';position:absolute;top:0;left:24%;right:24%;height:3px;background:var(--ink)}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs .n{position:absolute;top:6px;left:calc(50% + 7px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--ink);color:var(--surface);font:600 10px/17px var(--f-mono);text-align:center}
.tabs .n:empty{display:none}
/* esquemas */
.ctl{display:flex;gap:8px;flex-wrap:wrap}
.bloques{display:flex;flex-direction:column;gap:14px;padding-top:4px}
.bloque{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.bloque::before{content:'';position:absolute;left:14px;top:-4px;width:48px;height:4px;border-radius:2px 2px 0 0;background:var(--c)}
.bloque>summary{list-style:none;display:grid;gap:7px;padding:14px;cursor:pointer}
.bloque>summary::-webkit-details-marker{display:none}
.bq-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bq-name{font:800 21px/1.12 var(--f-display);text-wrap:balance}
.bq-hook{color:var(--ink-2);font-size:14px}
.bq-span{font:500 12px/1 var(--f-mono);color:var(--ink-3)}
.chev{flex:0 0 auto;width:18px;height:18px;stroke:var(--ink-3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.bloque[open]>summary .chev{transform:rotate(180deg)}
.ramas{display:flex;flex-direction:column;border-top:1px solid var(--line-2)}
.rama{border-bottom:1px solid var(--line-2)}
.rama:last-child{border-bottom:0}
.rama>summary{list-style:none;display:flex;gap:11px;align-items:flex-start;padding:12px 14px;min-height:48px;cursor:pointer}
.rama>summary::-webkit-details-marker{display:none}
.rama .mk{flex:0 0 auto;width:9px;height:9px;margin-top:7px;border-radius:2px;background:var(--c);transition:transform .15s}
.rama[open]>summary .mk{transform:rotate(45deg)}
.rama .rt{font-weight:700}
.rama .rm{display:block;margin-top:4px;font:500 12px/1.4 var(--f-mono);color:var(--ink-2)}
.rama ul{display:flex;flex-direction:column;gap:7px;padding:0 14px 14px 34px;color:var(--ink-2);font-size:15px}
.rama li{position:relative}
.rama li::before{content:'';position:absolute;left:-13px;top:.62em;width:6px;height:1px;background:var(--ink-3)}
.tw{overflow-x:auto;margin:2px 14px 14px;border:1px solid var(--line-2);border-radius:var(--r)}
.tw table{width:100%;min-width:430px;border-collapse:collapse;font-size:13px}
.tw th{padding:8px;text-align:left;background:var(--surface-2);color:var(--ink-3);font:600 11px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.tw td{padding:8px;border-top:1px solid var(--line-2);vertical-align:top;color:var(--ink-2)}
.tw td:first-child{font-weight:700;color:var(--ink);white-space:nowrap}
.tw caption{caption-side:top;padding:10px 8px 0;text-align:left}
.bq-right{display:flex;align-items:center;gap:10px}
/* frisa cronológica (a escala) */
.frisa{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 8px}
.fr-rows{position:relative;display:flex;flex-direction:column;gap:2px}
.fr-tick{position:absolute;top:0;bottom:0;width:1px;background:var(--line-2)}
.fr-row{position:relative;display:block;width:100%;height:24px;padding:0;border:0;background:transparent;text-align:left;transition:opacity .15s}
.fr-bar{position:absolute;top:7px;height:10px;min-width:6px;border-radius:2px;background:var(--c)}
.fr-lab{position:absolute;top:0;font:700 11px/24px var(--f-body);color:var(--ink-2);white-space:nowrap}
.frisa[data-f] .fr-row{opacity:.38}
.frisa[data-f] .fr-row[aria-pressed="true"]{opacity:1}
.fr-axis{position:relative;height:16px;margin-top:4px;font:500 10px/16px var(--f-mono);color:var(--ink-3)}
.fr-axis span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.fr-hint{margin-top:4px;font-size:12px;color:var(--ink-3)}
/* línea del tiempo */
.cnt{font:500 12px/1 var(--f-mono);color:var(--ink-3)}
.tl{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:84px 14px minmax(0,1fr);column-gap:9px}
.ev-y{padding-top:10px;text-align:right;font:600 13px/1.25 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.ev-rail{position:relative}
.ev-rail::before{content:'';position:absolute;left:6px;top:0;bottom:0;width:2px;background:var(--line)}
.ev:first-child .ev-rail::before{top:14px}
.ev:last-child .ev-rail::before{bottom:calc(100% - 22px)}
.ev-rail i{position:absolute;left:1px;top:12px;width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--bg)}
.ev-body{padding:7px 0 14px;min-width:0}
.ev-t{font-weight:700;line-height:1.3}
.ev-d{margin-top:2px;color:var(--ink-2);font-size:14px}
.ev-m{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:7px}
.cov{display:flex;align-items:center;justify-content:center;width:100%;min-height:36px;padding:0 10px;border:1px dashed var(--ink-3);border-radius:2px;background:var(--surface-2);color:var(--ink-3);font:600 12px/1 var(--f-mono);cursor:pointer}
.ev-body .cov{min-height:46px}
.flag{padding:4px 7px;border:1px solid var(--bad);border-radius:2px;background:transparent;color:var(--bad);font:600 11px/1 var(--f-mono);letter-spacing:.04em;text-transform:uppercase}
.empty{padding:28px 12px;text-align:center;color:var(--ink-3)}
/* tarjetas */
.fc-sum{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
.fc-sum b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.sess{display:flex;align-items:center;gap:12px}
.sess .bar{flex:1;width:auto}
.fc{position:relative;display:flex;flex-direction:column;gap:16px;min-height:340px;padding:18px 16px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 14px 26px -22px rgba(16,26,43,.55)}
.fc::before{content:'';position:absolute;left:14px;top:-4px;width:48px;height:4px;border-radius:2px 2px 0 0;background:var(--c)}
.fc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fc-q{font:700 27px/1.2 var(--f-display);text-wrap:balance}
.fc-rule{height:2px;background:var(--c)}
.fc-a{font-size:19px;line-height:1.45}
.fc-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.fc-hint{font-size:13px;color:var(--ink-3);text-align:center}
.grades{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.g{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:60px;padding:6px;border:1px solid var(--ink);border-radius:var(--r);background:transparent;font:700 14px/1.15 var(--f-body);text-align:center}
.g small{font:500 11px/1 var(--f-mono);color:var(--ink-3)}
.g.ok{background:var(--ink);color:var(--surface)}
.g.ok small{color:inherit;opacity:.8}
.done{display:flex;flex-direction:column;gap:12px;padding:22px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.done .big{font:800 30px/1.1 var(--f-display);text-wrap:balance}
.row-btn{display:flex;gap:8px;flex-wrap:wrap}
/* test */
.qbox{display:flex;flex-direction:column;gap:14px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.qt{font:700 23px/1.22 var(--f-display);text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;min-height:54px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);text-align:left;font:400 16px/1.3 var(--f-body)}
.opt .k{flex:0 0 auto;display:grid;place-items:center;width:26px;height:26px;border:1px solid var(--ink-3);border-radius:2px;font:600 12px/1 var(--f-mono);color:var(--ink-2)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.right .k{border-color:var(--good);background:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.opt.wrong .k{border-color:var(--bad);background:var(--bad);color:var(--surface)}
.opt[disabled]{cursor:default}
.fb{padding:10px 12px;border-radius:var(--r);background:var(--surface-2);font-size:14px;color:var(--ink-2)}
.score{font:800 64px/1 var(--f-display)}
.miss{display:flex;flex-direction:column;gap:10px}
.miss li{padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-size:14px;color:var(--ink-2)}
.miss b{display:block;color:var(--ink);font-size:15px;margin-bottom:2px}
/* dudas */
.dd{display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.dd.hl{outline:2px solid var(--focus);outline-offset:2px}
.dd h3{font:800 19px/1.2 var(--f-display);text-wrap:balance}
.dd .r{display:grid;gap:3px}
.dd .r p{font-size:15px;color:var(--ink-2)}
.sev{align-self:flex-start;padding:4px 7px;border:1px solid var(--ink-3);border-radius:2px;color:var(--ink-2);font:600 11px/1 var(--f-mono);letter-spacing:.05em;text-transform:uppercase}
.sev.g1{border-color:var(--bad);color:var(--bad)}
.note{padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);font-size:14px;color:var(--ink-2)}
</style>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Historia de España</h1>
      <span class="lab">Repaso de tus apuntes</span>
    </div>
    <div class="meter" title="Tarjetas que ya dominas">
      <b id="meterTxt">0 de 0</b>
      <div class="bar"><i id="meterBar"></i></div>
    </div>
  </div>
</header>

<main class="app wrap" id="main">
  <section class="panel" id="p-esquema" role="tabpanel" aria-labelledby="t-esquema"></section>
  <section class="panel" id="p-fechas" role="tabpanel" aria-labelledby="t-fechas" hidden></section>
  <section class="panel" id="p-tarjetas" role="tabpanel" aria-labelledby="t-tarjetas" hidden></section>
  <section class="panel" id="p-test" role="tabpanel" aria-labelledby="t-test" hidden></section>
  <section class="panel" id="p-dudas" role="tabpanel" aria-labelledby="t-dudas" hidden></section>
</main>

<nav class="tabs" role="tablist" aria-label="Secciones">
  <div class="wrap">
    <button role="tab" id="t-esquema" data-tab="esquema" aria-selected="true" aria-controls="p-esquema">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4v14M6 7h13M6 12h9M6 18h11"/></svg><span>Esquema</span>
    </button>
    <button role="tab" id="t-fechas" data-tab="fechas" aria-selected="false" aria-controls="p-fechas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18"/><circle cx="12" cy="7" r="2.2"/><circle cx="12" cy="16" r="2.2"/><path d="M15 7h5M4 16h5"/></svg><span>Fechas</span>
    </button>
    <button role="tab" id="t-tarjetas" data-tab="tarjetas" aria-selected="false" aria-controls="p-tarjetas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="7" width="16" height="12" rx="1.5"/><path d="M7 4h10"/></svg><span>Tarjetas</span><span class="n" id="nTarjetas"></span>
    </button>
    <button role="tab" id="t-test" data-tab="test" aria-selected="false" aria-controls="p-test">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="m8.5 12.2 2.5 2.5 4.5-5"/></svg><span>Test</span>

    <button role="tab" id="t-dudas" data-tab="dudas" aria-selected="false" aria-controls="p-dudas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21V4M6 5h12l-2.5 4L18 13H6"/></svg><span>Dudas</span><span class="n" id="nDudas"></span>
    </button>
  </div>
</nav>
<script>
/* ===== DATOS 1: bloques y cronología (todo sale de los apuntes) ===== */
const BLOQUES=[
{id:'roma',tema:'Tema 1',n:'Conquista romana',c:'Roma',a:-218,b:409},
{id:'visi',tema:'Tema 1',n:'Hispania visigoda',c:'Visigodos',a:409,b:711},
{id:'and',tema:'Tema 2',n:'Al-Andalus',c:'Al-Andalus',a:711,b:1492},
{id:'cortes',tema:'Tema 3',n:'Cortes medievales',c:'Cortes',a:1188,b:1230},
{id:'desc',tema:'Tema 6',n:'Descubrimiento de América',c:'América',a:1487,b:1542},
{id:'imp',tema:'Siglo XVI',n:'Carlos V y Felipe II',c:'Imperio',a:1516,b:1598},
{id:'oliv',tema:'Tema 8',n:'El valido Olivares',c:'Olivares',a:1621,b:1652},
{id:'crisis',tema:'Siglo XVII',n:'Crisis del siglo XVII',c:'Crisis XVII',a:1598,b:1700}
];

/* [bloque, año, etiqueta de rango, título, detalle, quiz(0=no), duda] */
const EVENTOS=[
['roma',-219,'','Aníbal toma Sagunto','Detonante de la II Guerra Púnica'],
['roma',-218,'','Desembarcan los Escipiones','Roma entra en la Península y empieza la conquista'],

const $=(s,r)=>(r||document).querySelector(s);

function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs)for(const k in attrs){
    const v=attrs[k];
    if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k==='text')e.textContent=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':String(v));
  }
  for(let i=2;i<arguments.length;i++){
    const kids=[].concat(arguments[i]);
    for(const c of kids){
      if(c==null||c===false)continue;
      e.append(c&&c.nodeType?c:document.createTextNode(String(c)));
    }
  }
  return e;
}

function hashStr(s){let x=5381;for(let i=0;i<s.length;i++)x=((x<<5)+x+s.charCodeAt(i))|0;return (x>>>0).toString(36)}

let remoteRef=null,remoteBusy=false,remoteDirty=false,remoteTimer=0;
function queueRemote(){
  if(!remoteRef)return;
  clearTimeout(remoteTimer);
  remoteTimer=setTimeout(flushRemote,1800);
}
async function flushRemote(){
  if(!remoteRef)return;
  if(remoteBusy){remoteDirty=true;return}
  remoteBusy=true;
  try{await remoteRef.set({cards:S.cards,quiz:S.quiz,t:S.t})}catch(e){}
  remoteBusy=false;
  if(remoteDirty){remoteDirty=false;queueRemote()}
}
async function initRemote(){
  try{
    const C=window.claude;
    if(!C||typeof C.use!=='function')return;
    const res=await Promise.all([C.use('db'),C.use('user')]);
    const db=res[0],user=res[1];
    if(!db||!user)return;
    const uid=await user.id();
    if(!uid)return;
    const ref=db.doc('data/users/'+uid+'/estudio');
    const snap=await ref.get();
    remoteRef=ref;
    const r=snap.exists?snap.data():null;
    if(r&&r.t>S.t){
      S.cards=r.cards||{};
      S.quiz=Object.assign({n:0,ok:0,best:0},r.quiz||{});
      S.t=r.t;
      persist(false);
      renderStats();
      if(!fc.started)renderTarjetas();
    }else if(S.t>0&&(!r||S.t>r.t)){queueRemote()}
  }catch(e){}
}

        h('div',{class:'bq-name',text:b.n}),
        h('div',{class:'bq-hook',text:e.gancho})

      ramas
    ));
  });

}
/* ===== FECHAS: frisa a escala + línea del tiempo con modo «tapar» ===== */
const tl={mode:'todo',f:'',shown:new Set()};
const DOM_A=-250,DOM_B=1720;
const pct=y=>(y-DOM_A)/(DOM_B-DOM_A)*100;

function frisa(){
  const rows=h('div',{class:'fr-rows'});
  [-200,1,500,1000,1500].forEach(y=>rows.append(h('i',{class:'fr-tick',style:'left:'+pct(y).toFixed(2)+'%'})));
  BLOQUES.forEach(b=>{
    const l=pct(b.a),w=pct(b.b)-l,mid=l+w/2;
    const lab=h('span',{class:'fr-lab',text:b.c});
    if(mid<50)lab.style.left='calc('+(l+w).toFixed(2)+'% + 8px)';
    else lab.style.right='calc('+(100-l).toFixed(2)+'% + 8px)';
    rows.append(h('button',{class:'fr-row',type:'button','data-f':b.id,'aria-pressed':'false','aria-label':b.n+', de '+yl(b.a)+' a '+yl(b.b),style:colVar(b.id),onclick:()=>setFilter(tl.f===b.id?'':b.id)},
      h('span',{class:'fr-bar',style:'left:'+l.toFixed(2)+'%;width:'+w.toFixed(2)+'%'}),lab));
  });
  const axis=h('div',{class:'fr-axis'});
  [[-200,'200 a.C.'],[1,'1'],[500,'500'],[1000,'1000'],[1500,'1500']].forEach(t=>axis.append(h('span',{style:'left:'+pct(t[0]).toFixed(2)+'%',text:t[1]})));
  return h('div',{class:'frisa',id:'frisa'},rows,axis,h('div',{class:'fr-hint',text:'A escala, de 218 a.C. a 1700. Toca un bloque para filtrar.'}));
}
function modeBtn(m,label){
  return h('button',{type:'button','data-mode':m,'aria-pressed':'false',text:label,onclick:()=>setMode(m)});
}
function chipBtn(id,label){

    id?h('span',{class:'dot'}):null,label);
}
function syncFechas(){
  $$('#p-fechas [data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===tl.mode)));
  $$('#p-fechas .chip').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.f===tl.f)));

  if(tl.f)fr.setAttribute('data-f',tl.f);else fr.removeAttribute('data-f');
}
function setMode(m){tl.mode=m;tl.shown.clear();syncFechas();drawList()}
function setFilter(id){tl.f=id;syncFechas();drawList()}
function reveal(i){tl.shown.add(i);drawList()}
function evMeta(e){
  const m=h('div',{class:'ev-m'},h('span',{class:'tag',text:B[e.b].c}));

}
function drawList(){

    const bEl=covT
      ?h('button',{class:'cov',type:'button',text:'Toca para ver el suceso',onclick:()=>reveal(e.i)})
      :[h('div',{class:'ev-t',text:e.t}),e.d?h('div',{class:'ev-d',text:e.d}):null,evMeta(e)];

function renderFechas(){
  const p=$('#p-fechas');
  p.textContent='';
  p.append(
    h('h2',{class:'h2',text:'La línea del tiempo'}),

  );

}
/* ===== TARJETAS: repaso espaciado (cajas 0-5; intervalos en días) ===== */
const INTV=[0,1,3,7,14,30];
const fc={bid:'',queue:[],i:0,flipped:false,started:false,practice:false,max:15,stats:{si:0,casi:0,no:0}};
const fmtDays=n=>n===0?'hoy':n===1?'mañana':'en '+n+' días';
function gradeResult(box,g){
  if(g==='no')return{box:0,days:0};
  if(g==='casi'){const b=Math.max(1,box);return{box:b,days:1}}
  const nb=Math.min(5,box+1);
  return{box:nb,days:INTV[nb]};
}
function fcChip(id,label){
  return h('button',{class:'chip',type:'button','data-b':id,'aria-pressed':'false',style:id?colVar(id):null,onclick:()=>{fc.bid=id;startSession(false)}},
    id?h('span',{class:'dot'}):null,label);
}
function renderFcSummary(){
  const el=$('#fcSum');
  if(!el)return;
  const pool=CARDS.filter(c=>!fc.bid||c.b===fc.bid);
  const due=dueList(fc.bid).length;
  const fresh=pool.filter(c=>!S.cards[c.id]).length;
  const dom=pool.filter(c=>{const r=S.cards[c.id];return r&&r[0]>=3}).length;
  el.textContent='';
  el.append(h('span',null,'Pendientes hoy ',h('b',{text:due})),h('span',null,'Nuevas ',h('b',{text:fresh})),h('span',null,'Dominadas ',h('b',{text:dom+' de '+pool.length})));
  $$('#p-tarjetas .chip').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.b===fc.bid)));
}
function startSession(practice){
  fc.practice=!!practice;fc.i=0;fc.flipped=false;fc.started=false;fc.stats={si:0,casi:0,no:0};
  let list;
  if(practice){
    list=shuffle(CARDS.filter(c=>!fc.bid||c.b===fc.bid)).slice(0,10);
  }else{
    const due=dueList(fc.bid);
    const seen=due.filter(c=>S.cards[c.id]).sort((a,b)=>S.cards[a.id][0]-S.cards[b.id][0]||S.cards[a.id][1]-S.cards[b.id][1]);
    const fresh=shuffle(due.filter(c=>!S.cards[c.id]));
    list=seen.concat(fresh).slice(0,fc.max);
  }
  fc.queue=list;
  renderFcSummary();
  drawFc();
}
function flip(){fc.flipped=true;fc.started=true;drawFc()}
function grade(g){
  const c=fc.queue[fc.i];
  if(!c)return;
  const r=S.cards[c.id];
  const res=gradeResult(r?r[0]:0,g);
  fc.stats[g]++;
  fc.started=true;
  if(!fc.practice){
    S.cards[c.id]=[res.box,today()+res.days];
    persist(true);
    renderStats();
  }
  if(g==='no'&&!fc.practice)fc.queue.push(c);
  fc.i++;fc.flipped=false;
  renderFcSummary();
  drawFc();
}
function gBtn(g,label,c,ok){
  const r=S.cards[c.id];
  const sub=fc.practice?'sin guardar':fmtDays(gradeResult(r?r[0]:0,g).days);
  return h('button',{class:'g'+(ok?' ok':''),type:'button',onclick:()=>grade(g)},label,h('small',{text:sub}));
}
function cardEl(c){
  const foot=fc.flipped
    ?h('div',{class:'grades'},gBtn('no','No la sabía',c),gBtn('casi','Casi',c),gBtn('si','La sabía',c,true))
    :[h('button',{class:'btn pri',type:'button',text:'Ver respuesta',onclick:flip}),h('div',{class:'fc-hint',text:'Primero responde en voz alta'})];
  return h('div',{class:'fc',style:colVar(c.b)},
    h('div',{class:'fc-top'},h('span',{class:'tag',text:B[c.b].c}),c.f?h('button',{class:'flag',type:'button',text:'Revisa',onclick:()=>goDuda(c.f)}):null),
    h('div',{class:'fc-q',text:c.q}),
    fc.flipped?[h('div',{class:'fc-rule'}),h('div',{class:'fc-a',text:c.a})]:null,
    h('div',{class:'fc-foot'},foot));
}
function doneEl(){
  const st=fc.stats,tom=CARDS.filter(c=>{const r=S.cards[c.id];return r&&r[1]===today()+1}).length;
  const left=dueList(fc.bid).length;
  const btns=h('div',{class:'row-btn'});
  if(!fc.practice&&left>0)btns.append(h('button',{class:'btn pri',type:'button',text:'Otra tanda',onclick:()=>startSession(false)}));
  btns.append(h('button',{class:'btn',type:'button',text:'Practicar 10 al azar',onclick:()=>startSession(true)}));
  btns.append(h('button',{class:'btn',type:'button',text:'Repasar el esquema',onclick:()=>goTab('esquema')}));
  return h('div',{class:'done'},
    h('div',{class:'lab',text:fc.practice?'Práctica terminada':'Tanda terminada'}),
    h('div',{class:'big',text:st.si+' sabidas, '+st.casi+' casi, '+st.no+' falladas'}),
    h('p',{class:'intro',text:fc.practice?'Esta práctica no cambia tu calendario de repaso.':(left>0?'Te quedan '+left+' pendientes hoy.':'Hoy ya no te queda nada. Mañana te tocan '+tom+' tarjetas más las nuevas que quieras.')}),
    btns);
}
function emptyFcEl(){
  return h('div',{class:'done'},
    h('div',{class:'big',text:'Hoy no tienes tarjetas pendientes'}),
    h('p',{class:'intro',text:'Vuelve mañana para repasar las que ya has visto, o practica ahora sin que cuente.'}),
    h('div',{class:'row-btn'},h('button',{class:'btn pri',type:'button',text:'Practicar 10 al azar',onclick:()=>startSession(true)})));
}
function drawFc(){
  const area=$('#fcArea');
  if(!area)return;
  area.textContent='';
  if(!fc.queue.length){area.append(emptyFcEl());return}
  if(fc.i>=fc.queue.length){area.append(doneEl());return}
  area.append(
    h('div',{class:'sess'},h('span',{class:'cnt',text:(fc.i+1)+' de '+fc.queue.length}),h('div',{class:'bar'},h('i',{style:'width:'+Math.round(fc.i/fc.queue.length*100)+'%'}))),
    cardEl(fc.queue[fc.i]));
}
function renderTarjetas(){
  const p=$('#p-tarjetas');
  p.textContent='';
  p.append(
    h('h2',{class:'h2',text:'Tarjetas con repaso espaciado'}),
    h('p',{class:'intro',text:'Responde en voz alta antes de destapar. Las que fallas vuelven hoy; las que aciertas vuelven mañana, a los 3 días, a la semana y a las dos semanas.'}),
    h('div',{class:'fc-sum',id:'fcSum'}),
    h('div',{class:'chips',role:'group','aria-label':'Filtrar por bloque'},fcChip('','Todas'),BLOQUES.map(b=>fcChip(b.id,b.c))),
    h('div',{id:'fcArea',class:'panel','aria-live':'polite'})
  );
  startSession(false);
}
/* ===== TEST: preguntas escritas + preguntas de fechas generadas desde la cronología ===== */
const qz={bid:'',n:10,list:[],i:0,ok:0,miss:[],locked:false};
const LET=['A','B','C','D'];
function yearDistractors(e){
  const seen={};seen[e.y]=1;
  const ys=[];
  EV.forEach(o=>{if(!seen[o.y]){seen[o.y]=1;ys.push(o.y)}});
  ys.sort((a,b)=>Math.abs(a-e.y)-Math.abs(b-e.y));
  return shuffle(ys.slice(0,6)).slice(0,3);
}
function qAsk(e){
  const ds=yearDistractors(e);
  return{k:'a',b:e.b,q:'¿En qué año ocurrió: '+e.t+'?',ok:yl(e.y),opts:shuffle([e.y].concat(ds)).map(yl),x:e.f?'':e.d};
}
function qWhat(e){
  const same=EV.filter(o=>o.b===e.b&&o.y!==e.y&&o.t!==e.t);
  const rest=EV.filter(o=>o.b!==e.b&&o.y!==e.y&&o.t!==e.t);
  const ds=shuffle(same).slice(0,3);
  if(ds.length<3)shuffle(rest).slice(0,3-ds.length).forEach(o=>ds.push(o));
  return{k:'b',b:e.b,q:'¿Qué ocurrió en '+evLabel(e)+'?',ok:e.t,opts:shuffle([e].concat(ds)).map(o=>o.t),x:e.f?'':e.d};
}
function buildPool(bid){
  const m=[],a=[];
  TEST.forEach(r=>{
    if(bid&&r[0]!==bid)return;
    m.push({k:'m',b:r[0],q:r[1],ok:r[2],opts:shuffle([r[2]].concat(r[3])),x:''});
  });
  EV.forEach(e=>{
    if(!e.q||(bid&&e.b!==bid))return;
    a.push(qAsk(e));
    if(yearCount[e.y]===1)a.push(qWhat(e));
  });
  return{m:shuffle(m),a:shuffle(a)};
}
function pickList(bid,n){
  const p=buildPool(bid);
  const nm=Math.min(p.m.length,Math.ceil(n/2));
  const na=Math.min(p.a.length,n-nm);
  let list=p.m.slice(0,nm).concat(p.a.slice(0,na));
  if(list.length<n)list=list.concat(p.m.slice(nm).concat(p.a.slice(na)).slice(0,n-list.length));
  return shuffle(list);
}
function qzChip(id,label){
  return h('button',{class:'chip',type:'button','data-b':id,'aria-pressed':String(qz.bid===id),style:id?colVar(id):null,onclick:()=>{qz.bid=id;renderTest()}},
    id?h('span',{class:'dot'}):null,label);
}
function renderTest(){
  const p=$('#p-test');
  p.textContent='';
  const best=S.quiz.best>0?'Mejor resultado: '+S.quiz.best+' %. ':'';
  p.append(
    h('h2',{class:'h2',text:'Ponte a prueba'}),
    h('p',{class:'intro',text:best+'Mezcla preguntas sobre personajes y conceptos con preguntas de fechas. Cada vez salen distintas.'}),
    h('div',{class:'chips',role:'group','aria-label':'Elegir bloque'},qzChip('','Todos'),BLOQUES.map(b=>qzChip(b.id,b.c))),
    h('div',{class:'seg',role:'group','aria-label':'Número de preguntas'},
      [10,20].map(n=>h('button',{type:'button','aria-pressed':String(qz.n===n),text:n+' preguntas',onclick:()=>{qz.n=n;renderTest()}}))),
    h('button',{class:'btn pri',type:'button',text:'Empezar',onclick:()=>startQuiz(pickList(qz.bid,qz.n))})
  );
}
function startQuiz(list){
  qz.list=list;qz.i=0;qz.ok=0;qz.miss=[];qz.locked=false;
  drawQ(-1);
}
function answer(idx){
  if(qz.locked)return;
  qz.locked=true;
  const q=qz.list[qz.i];
  const right=q.opts[idx]===q.ok;
  if(right)qz.ok++;else qz.miss.push(q);
  S.quiz.n++;if(right)S.quiz.ok++;
  drawQ(idx);
}
function nextQ(){
  qz.i++;qz.locked=false;
  if(qz.i>=qz.list.length)finishQuiz();else drawQ(-1);
}
function drawQ(sel){
  const p=$('#p-test');
  p.textContent='';
  const q=qz.list[qz.i];
  if(!q){renderTest();return}
  const last=qz.i===qz.list.length-1;
  const opts=h('div',{class:'opts'},q.opts.map((o,i)=>{
    let cls='opt',mark=LET[i];
    if(qz.locked){
      if(o===q.ok){cls+=' right';mark='✓'}
      else if(i===sel){cls+=' wrong';mark='✗'}
    }
    return h('button',{class:cls,type:'button',disabled:qz.locked?true:null,onclick:()=>answer(i)},h('span',{class:'k',text:mark}),h('span',{text:o}));
  }));
  const box=h('div',{class:'qbox',style:colVar(q.b)},
    h('div',{class:'sess'},h('span',{class:'tag',text:B[q.b].c}),h('span',{class:'cnt',text:(qz.i+1)+' de '+qz.list.length}),h('div',{class:'bar'},h('i',{style:'width:'+Math.round(qz.i/qz.list.length*100)+'%'}))),
    h('div',{class:'qt',text:q.q}),
    opts);
  if(qz.locked){
    const right=q.opts[sel]===q.ok;
    box.append(h('div',{class:'fb',role:'status',text:(right?'Correcto. ':'Era: '+q.ok+'. ')+(q.x||'')}));
    box.append(h('button',{class:'btn pri',type:'button',text:last?'Ver resultado':'Siguiente',onclick:nextQ}));
  }
  p.append(box);
}
function finishQuiz(){
  const total=qz.list.length,pc=Math.round(qz.ok/total*100);
  if(pc>S.quiz.best)S.quiz.best=pc;
  persist(true);
  const p=$('#p-test');
  p.textContent='';
  const cnt={};qz.miss.forEach(q=>{cnt[q.b]=(cnt[q.b]||0)+1});
  let worst='',wn=0;
  Object.keys(cnt).forEach(b=>{if(cnt[b]>wn){wn=cnt[b];worst=b}});
  const msg=qz.miss.length===0?'Sin fallos. Pasa a las tarjetas para que se quede a largo plazo.':'Donde más has fallado: '+B[worst].n+'. Vuelve a su esquema antes de repetir.';
  const btns=h('div',{class:'row-btn'});
  if(qz.miss.length)btns.append(h('button',{class:'btn pri',type:'button',text:'Repetir los fallos',onclick:()=>startQuiz(shuffle(qz.miss).map(q=>Object.assign({},q,{opts:shuffle(q.opts)})))}));
  btns.append(h('button',{class:'btn'+(qz.miss.length?'':' pri'),type:'button',text:'Nuevo test',onclick:renderTest}));
  btns.append(h('button',{class:'btn',type:'button',text:'Ir al esquema',onclick:()=>goTab('esquema')}));
  p.append(
    h('div',{class:'done'},
      h('div',{class:'lab',text:'Resultado'}),
      h('div',{class:'score',text:qz.ok+' / '+total}),
      h('p',{class:'intro',text:pc+' %. '+msg}),
      btns),
    qz.miss.length?h('div',{class:'miss'},h('div',{class:'lab',text:'Para repasar'}),h('ul',{class:'miss'},qz.miss.map(q=>h('li',null,h('b',{text:q.q}),'Respuesta: '+q.ok)))):null
  );
}
/* ===== DUDAS + ARRANQUE ===== */
function renderDudas(){
  const p=$('#p-dudas');
  p.textContent='';
  p.append(
    h('h2',{class:'h2',text:'Puntos de tus apuntes que conviene comprobar'}),
    h('p',{class:'intro',text:'Al pasar los apuntes a tarjetas he visto datos que no coinciden con lo habitual. No los he cambiado en las tarjetas: en el examen manda lo que diga tu profesor o tu libro.'}),
    DUDAS.map(d=>h('article',{class:'dd',id:'d-'+d.id},

    )),

  );
  $('#nDudas').textContent=String(DUDAS.length);

init();
